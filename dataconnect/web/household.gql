query FindStaffAttendanceTag($householdId: UUID!, $staffId: UUID!) @auth(level: USER) {
  nfcTags(where: {
    household: { id: { eq: $householdId }, ownerUid: { eq_expr: "auth.uid" } }
    staff: { id: { eq: $staffId } }
    tagType: { eq: "staff-attendance" }
    isActive: { eq: true }
  }, orderBy: [{ createdAt: DESC }], limit: 1) { id }
}

mutation UpsertCurrentUser($displayName: String, $email: String) @auth(level: USER) {
  user_upsert(
    data: {
      uid_expr: "auth.uid"
      displayName: $displayName
      email: $email
      updatedAt_expr: "request.time"
    }
  )
}

mutation CreateHousehold($name: String!, $timezone: String!, $addressLabel: String) @auth(level: USER) @transaction {
  user_upsert(data: { uid_expr: "auth.uid", updatedAt_expr: "request.time" })
  household_insert(
    data: {
      name: $name
      timezone: $timezone
      addressLabel: $addressLabel
      owner: { uid_expr: "auth.uid" }
    }
  )
}

query MyHouseholds @auth(level: USER)
  @refresh(onMutationExecuted: { operation: "AddPaidStaffMember", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "UpdateStaffPhoto", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "AddTaskInstance", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "SetTaskCompletion", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "DeleteTaskInstance", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "ReassignTaskInstance", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "UpdateTaskDueDate", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "SaveAttendanceAndPay", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "EnsureMonthlyPayroll", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "SetAppLanguage", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "PostCashPurchase", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "ReviewStaffCashRequest", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "CreateStaffCashRequest", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "AddExpenseEntry", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "CreateInventoryItem", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "RecordPayrollDeduction", condition: "mutation.auth.uid == request.auth.uid" })
  @refresh(onMutationExecuted: { operation: "CreateHousehold", condition: "mutation.auth.uid == request.auth.uid" }) {
  households(where: { ownerUid: { eq_expr: "auth.uid" } }, orderBy: [{ createdAt: DESC }]) {
    id
    name
    owner { language }
    payrollProfiles_on_household(limit: 1000) { staffId }
    timezone
    addressLabel
    createdAt
    homemateProfiles_on_household(limit: 50, orderBy: [{ createdAt: ASC }]) {
      id
      name
      relationLabel
      phone
      notes
    }
    roomZones_on_household(limit: 100, orderBy: [{ createdAt: ASC }]) {
      id
      name
      floorLabel
      notes
    }
    inventoryItems_on_household(limit: 200, orderBy: [{ name: ASC }]) {
      id
      name
      category
      unit
      currentQuantity
      minimumQuantity
      room {
        id
        name
      }
    }
    staffCashRequests_on_household(limit: 100, orderBy: [{ requestedAt: DESC }]) {
      id
      category
      amountRequested
      amountApproved
      reason
      status
      neededBy
      requestedAt
      approvedAt
      purchasedAt
      receiptUrl
      notes
      staff {
        id
        name
        role
      }
      inventoryItem {
        id
        name
        category
        unit
      }
      linkedExpense {
        id
        amount
        description
      }
    }
    attendanceCorrectionRequests_on_household(limit: 100, orderBy: [{ requestedAt: DESC }]) {
      id
      currentStatus
      requestedStatus
      reason
      status
      requestedFor
      requestedAt
      reviewedAt
      notes
      staff {
        id
        name
        role
      }
    }
    cctvCameras_on_household(limit: 100, orderBy: [{ name: ASC }]) {
      id
      name
      provider
      streamUrl
      status
      lastHeartbeatAt
      notes
      room {
        id
        name
      }
    }
    staffMembers_on_household(limit: 100, orderBy: [{ name: ASC }]) {
      id
      name
      role
      department
      phone
      photoUrl
      salary
      status
      locationLabel
      shiftStart
      shiftEnd
      reliabilityScore
      punctualityScore
      telegramChatId
      notes
    }
    taskInstances_on_household(limit: 100, orderBy: [{ createdAt: DESC }]) {
      id
      title
      status
      dueAt
      completedAt
      assignedStaff {
        id
        name
      }
    }
    alerts_on_household(where: { status: { eq: "active" } }, limit: 50, orderBy: [{ createdAt: DESC }]) {
      id
      alertType
      severity
      title
      description
      status
      createdAt
      staff {
        id
        name
      }
    }
    expenseEntries_on_household(limit: 100, orderBy: [{ spentAt: DESC }]) {
      id
      category
      amount
      description
      spentAt
      staff {
        id
        name
      }
    }
    payrollRuns_on_household(limit: 100, orderBy: [{ updatedAt: DESC }]) {
      id
      monthLabel
      baseSalary
      deductions
      advances
      netPay
      status
      updatedAt
      staff {
        id
      }
    }
  }
}
