mutation AddStaffMember(
  $householdId: UUID!
  $name: String!
  $role: String!
  $department: String!
  $phone: String
  $salary: Int!
  $shiftStart: String
  $shiftEnd: String
) @auth(level: USER) {
  query @redact {
    household(id: $householdId) {
      ownerUid @check(expr: "this == auth.uid", message: "You do not have access to this household")
    }
  }
  staffMember_insert(
    data: {
      household: { id: $householdId }
      name: $name
      role: $role
      department: $department
      phone: $phone
      salary: $salary
      shiftStart: $shiftStart
      shiftEnd: $shiftEnd
      updatedAt_expr: "request.time"
    }
  )
}

